name: Reusable CI

# Reusable CI pipeline: Plan -> Validate | Test | Security -> Container (optional) -> CI result.
# See README.md for usage, inputs and required caller permissions.

on:
  workflow_call:
    inputs:
      language:
        description: "Project language: node, python or go."
        type: string
        required: true
      language-version:
        description: "Runtime version. Defaults to .nvmrc/.node-version, .python-version or go.mod; otherwise lts/* (node) or 3.x (python)."
        type: string
        default: ""
      working-directory:
        description: "Project directory relative to the repository root."
        type: string
        default: "."
      package-manager:
        description: "Node only: npm, pnpm or yarn. Auto-detected from the lockfile when empty."
        type: string
        default: ""
      runs-on:
        description: "Runner label."
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: "Timeout for each job."
        type: number
        default: 30

      # Command overrides. Empty = language default, "skip" = disable the step.
      install-command:
        type: string
        default: ""
      format-command:
        type: string
        default: ""
      lint-command:
        description: "For go, the default is golangci-lint via golangci/golangci-lint-action."
        type: string
        default: ""
      typecheck-command:
        type: string
        default: ""
      unit-test-command:
        type: string
        default: ""
      integration-test-command:
        type: string
        default: ""
      audit-command:
        description: "Dependency vulnerability audit (npm/pnpm/yarn audit, pip-audit, govulncheck by default)."
        type: string
        default: ""

      # Tests & coverage
      compose-file:
        description: "Optional docker compose file (relative to working-directory) started before integration tests."
        type: string
        default: ""
      coverage-file:
        description: "Coverage report (lcov, Cobertura XML, Istanbul json-summary or Go coverprofile), relative to working-directory."
        type: string
        default: ""
      coverage-threshold:
        description: "Minimum line coverage percentage. 0 disables enforcement."
        type: number
        default: 0

      # Security
      enable-dependency-review:
        description: "Run actions/dependency-review-action on pull requests (needs the dependency graph)."
        type: boolean
        default: true
      dependency-review-fail-on-severity:
        type: string
        default: "high"
      enable-secret-scan:
        type: boolean
        default: true
      enable-codeql:
        description: "Run CodeQL code scanning (private repositories need GitHub Code Security)."
        type: boolean
        default: true

      # Container
      enable-docker:
        description: "Build, scan and (optionally) publish an OCI image."
        type: boolean
        default: false
      dockerfile:
        description: "Dockerfile path relative to the repository root."
        type: string
        default: "Dockerfile"
      docker-context:
        description: "Build context relative to the repository root."
        type: string
        default: "."
      image-name:
        description: "Full image name. Defaults to ghcr.io/<owner>/<repo>."
        type: string
        default: ""
      platforms:
        type: string
        default: "linux/amd64"
      build-args:
        description: "Newline-separated build arguments."
        type: string
        default: ""
      push-image:
        description: "Push to the registry on non pull_request events."
        type: boolean
        default: true
      image-scan-severity:
        type: string
        default: "CRITICAL,HIGH"
      fail-on-image-vulnerabilities:
        type: boolean
        default: true
    outputs:
      image-name:
        description: "Image name."
        value: ${{ jobs.container.outputs.image-name }}
      image-digest:
        description: "Published image digest (empty when not pushed)."
        value: ${{ jobs.container.outputs.digest }}
      image-tags:
        description: "Image tags (newline separated)."
        value: ${{ jobs.container.outputs.tags }}
      coverage:
        description: "Line coverage percentage."
        value: ${{ jobs.test.outputs.coverage }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    outputs:
      package-manager: ${{ steps.plan.outputs.package-manager }}
      version: ${{ steps.plan.outputs.version }}
      version-file: ${{ steps.plan.outputs.version-file }}
      cache-path: ${{ steps.plan.outputs.cache-path }}
      install: ${{ steps.plan.outputs.install }}
      format: ${{ steps.plan.outputs.format }}
      lint: ${{ steps.plan.outputs.lint }}
      golangci: ${{ steps.plan.outputs.golangci }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      unit: ${{ steps.plan.outputs.unit }}
      integration: ${{ steps.plan.outputs.integration }}
      audit: ${{ steps.plan.outputs.audit }}
      coverage-file: ${{ steps.plan.outputs.coverage-file }}
      codeql-language: ${{ steps.plan.outputs.codeql-language }}
      codeql-build-mode: ${{ steps.plan.outputs.codeql-build-mode }}
      image-name: ${{ steps.plan.outputs.image-name }}
      suffix: ${{ steps.plan.outputs.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve configuration
        id: plan
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          LANGUAGE: ${{ inputs.language }}
          WORKDIR: ${{ inputs.working-directory }}
          VERSION: ${{ inputs.language-version }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          IN_INSTALL: ${{ inputs.install-command }}
          IN_FORMAT: ${{ inputs.format-command }}
          IN_LINT: ${{ inputs.lint-command }}
          IN_TYPECHECK: ${{ inputs.typecheck-command }}
          IN_UNIT: ${{ inputs.unit-test-command }}
          IN_INTEGRATION: ${{ inputs.integration-test-command }}
          IN_AUDIT: ${{ inputs.audit-command }}
          IN_COVERAGE_FILE: ${{ inputs.coverage-file }}
          IN_IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail

          has_script() { [ -f package.json ] && jq -e --arg s "$1" '.scripts[$s] // empty' package.json >/dev/null; }
          out() {
            local delim
            delim="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delim" "$2" "$delim" >> "$GITHUB_OUTPUT"
          }
          # Empty override -> default, "skip" -> disabled, anything else -> as given.
          pick() { if [ -z "$1" ]; then printf '%s' "$2"; elif [ "$1" = "skip" ]; then printf ''; else printf '%s' "$1"; fi; }

          pm=""; version="$VERSION"; version_file=""; cache_path=""; golangci=false
          case "$LANGUAGE" in
            node)
              pm="$PACKAGE_MANAGER"
              if [ -z "$pm" ]; then
                if [ -f pnpm-lock.yaml ]; then pm=pnpm; elif [ -f yarn.lock ]; then pm=yarn; else pm=npm; fi
              fi
              case "$pm" in
                npm)  install="npm ci"; run="npm run"; exe="npx --no-install"; audit="npm audit --audit-level=high"; cache_path="$WORKDIR/package-lock.json" ;;
                pnpm) install="pnpm install --frozen-lockfile"; run="pnpm run"; exe="pnpm exec"; audit="pnpm audit --audit-level high"; cache_path="$WORKDIR/pnpm-lock.yaml" ;;
                yarn)
                  run="yarn run"; exe="yarn"; cache_path="$WORKDIR/yarn.lock"
                  if [ -f .yarnrc.yml ]; then
                    install="yarn install --immutable"; audit="yarn npm audit --all --recursive --severity high"
                  else
                    install="yarn install --frozen-lockfile"; audit="yarn audit --level high"
                  fi ;;
                *) echo "::error::Unsupported package manager '$pm'"; exit 1 ;;
              esac
              if [ -z "$version" ]; then
                if [ -f .nvmrc ]; then version_file="$WORKDIR/.nvmrc"
                elif [ -f .node-version ]; then version_file="$WORKDIR/.node-version"
                else version="lts/*"; fi
              fi
              if has_script format:check; then format="$run format:check"; else format="$exe prettier --check ."; fi
              if has_script lint; then lint="$run lint"; else lint="$exe eslint ."; fi
              if has_script typecheck; then typecheck="$run typecheck"
              elif [ -f tsconfig.json ]; then typecheck="$exe tsc --noEmit"
              else typecheck=""; fi
              if has_script test:unit; then unit="$run test:unit"; else unit="$pm test"; fi
              if has_script test:integration; then integration="$run test:integration"; else integration=""; fi
              coverage_file="coverage/lcov.info"
              codeql_lang="javascript-typescript"; codeql_mode="none"
              ;;
            python)
              if [ -z "$version" ]; then
                if [ -f .python-version ]; then version_file="$WORKDIR/.python-version"; else version="3.x"; fi
              fi
              cache_path="$WORKDIR/**/requirements*.txt
          $WORKDIR/**/pyproject.toml"
              install='python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
          pip install ruff mypy pytest pytest-cov pip-audit'
              format="ruff format --check ."
              lint="ruff check --output-format=github ."
              typecheck="mypy ."
              if [ -d tests/integration ]; then
                unit="pytest --ignore=tests/integration --cov --cov-report=xml:coverage.xml --cov-report=term"
                integration="pytest tests/integration"
              else
                unit="pytest --cov --cov-report=xml:coverage.xml --cov-report=term"
                integration=""
              fi
              audit="pip-audit --skip-editable"
              coverage_file="coverage.xml"
              codeql_lang="python"; codeql_mode="none"
              ;;
            go)
              if [ -z "$version" ]; then version_file="$WORKDIR/go.mod"; fi
              cache_path="$WORKDIR/go.sum"
              install="go mod download"
              # shellcheck disable=SC2016 # evaluated later by the format step
              format='unformatted="$(gofmt -l .)"; if [ -n "$unformatted" ]; then echo "::error::Files need gofmt:"; echo "$unformatted"; exit 1; fi'
              lint=""
              if [ -z "$IN_LINT" ]; then golangci=true; fi
              typecheck="go vet ./..."
              unit="go test -race -covermode=atomic -coverprofile=coverage.out ./..."
              if grep -rqE --include='*_test.go' '^//go:build .*integration' . 2>/dev/null; then
                integration="go test -race -tags=integration ./..."
              else
                integration=""
              fi
              audit="go run golang.org/x/vuln/cmd/govulncheck@latest ./..."
              coverage_file="coverage.out"
              codeql_lang="go"; codeql_mode="autobuild"
              ;;
            *)
              echo "::error::Unsupported language '$LANGUAGE' (expected node, python or go)"; exit 1 ;;
          esac

          declare -A cmd=(
            [install]="$(pick "$IN_INSTALL" "$install")"
            [format]="$(pick "$IN_FORMAT" "$format")"
            [lint]="$(pick "$IN_LINT" "$lint")"
            [typecheck]="$(pick "$IN_TYPECHECK" "$typecheck")"
            [unit]="$(pick "$IN_UNIT" "$unit")"
            [integration]="$(pick "$IN_INTEGRATION" "$integration")"
            [audit]="$(pick "$IN_AUDIT" "$audit")"
          )
          steps=(install format lint typecheck unit integration audit)
          for k in "${steps[@]}"; do out "$k" "${cmd[$k]}"; done

          image="${IN_IMAGE_NAME:-ghcr.io/$GITHUB_REPOSITORY}"
          out package-manager "$pm"
          out version "$version"
          out version-file "$version_file"
          out cache-path "$cache_path"
          out golangci "$golangci"
          out coverage-file "${IN_COVERAGE_FILE:-$coverage_file}"
          out codeql-language "$codeql_lang"
          out codeql-build-mode "$codeql_mode"
          out image-name "${image,,}"
          suffix="$LANGUAGE-${WORKDIR#./}"
          suffix="${suffix%-.}"
          out suffix "$(echo "$suffix" | tr -c '[:alnum:]._\n-' '-')"

          {
            echo "### CI plan: \`$LANGUAGE\`${pm:+ ($pm)}"
            echo "| Step | Command |"
            echo "|---|---|"
            for k in "${steps[@]}"; do
              v="${cmd[$k]}"
              if [ "$k" = lint ] && [ "$golangci" = true ]; then v="golangci-lint (action)"; fi
              first="${v%%$'\n'*}"; [ "$first" != "$v" ] && first="$first …"
              if [ -z "$v" ]; then echo "| $k | ⏭️ skipped |"; else echo "| $k | \`${first//|/\\|}\` |"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- Runtime setup + dependency caching (keep in sync across jobs) ----
      - name: Setup pnpm
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - name: Enable corepack
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'yarn'
        run: corepack enable
      - name: Setup Node.js
        if: inputs.language == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.plan.outputs.version }}
          node-version-file: ${{ needs.plan.outputs.version-file }}
          cache: ${{ needs.plan.outputs.package-manager }}
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      - name: Re-enable corepack
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'yarn'
        run: command -v corepack >/dev/null || npm install -g corepack; corepack enable
      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.plan.outputs.version }}
          python-version-file: ${{ needs.plan.outputs.version-file }}
          cache: pip
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.plan.outputs.version }}
          go-version-file: ${{ needs.plan.outputs.version-file }}
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      # ----------------------------------------------------------------------

      - name: Install dependencies
        id: install
        if: needs.plan.outputs.install != ''
        env:
          CMD: ${{ needs.plan.outputs.install }}
        run: eval "$CMD"

      # Checks run independently so a single run reports every problem.
      - name: Formatting
        id: format
        if: ${{ !cancelled() && steps.install.outcome != 'failure' && needs.plan.outputs.format != '' }}
        env:
          CMD: ${{ needs.plan.outputs.format }}
        run: eval "$CMD"

      - name: Linting (golangci-lint)
        id: golangci
        if: ${{ !cancelled() && steps.install.outcome != 'failure' && needs.plan.outputs.golangci == 'true' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: ${{ inputs.working-directory }}

      - name: Linting
        id: lint
        if: ${{ !cancelled() && steps.install.outcome != 'failure' && needs.plan.outputs.lint != '' }}
        env:
          CMD: ${{ needs.plan.outputs.lint }}
        run: eval "$CMD"

      - name: Type checking
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome != 'failure' && needs.plan.outputs.typecheck != '' }}
        env:
          CMD: ${{ needs.plan.outputs.typecheck }}
        run: eval "$CMD"

      - name: Report
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.golangci.outcome == 'skipped' && steps.lint.outcome || steps.golangci.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
        run: |
          row() { case "$2" in success) i="✅";; failure) i="❌";; skipped|"") i="⏭️";; *) i="⚠️";; esac; echo "| $1 | $i ${2:-skipped} |"; }
          {
            echo "### Validate"
            echo "| Check | Result |"
            echo "|---|---|"
            row Install "$INSTALL"
            row Formatting "$FORMAT"
            row Linting "$LINT"
            row "Type checking" "$TYPECHECK"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- Runtime setup + dependency caching (keep in sync across jobs) ----
      - name: Setup pnpm
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - name: Enable corepack
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'yarn'
        run: corepack enable
      - name: Setup Node.js
        if: inputs.language == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.plan.outputs.version }}
          node-version-file: ${{ needs.plan.outputs.version-file }}
          cache: ${{ needs.plan.outputs.package-manager }}
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      - name: Re-enable corepack
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'yarn'
        run: command -v corepack >/dev/null || npm install -g corepack; corepack enable
      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.plan.outputs.version }}
          python-version-file: ${{ needs.plan.outputs.version-file }}
          cache: pip
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.plan.outputs.version }}
          go-version-file: ${{ needs.plan.outputs.version-file }}
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      # ----------------------------------------------------------------------

      - name: Install dependencies
        id: install
        if: needs.plan.outputs.install != ''
        env:
          CMD: ${{ needs.plan.outputs.install }}
        run: eval "$CMD"

      - name: Unit tests
        id: unit
        if: needs.plan.outputs.unit != ''
        env:
          CMD: ${{ needs.plan.outputs.unit }}
        run: eval "$CMD"

      - name: Start integration services
        id: services
        if: ${{ !cancelled() && steps.install.outcome != 'failure' && needs.plan.outputs.integration != '' && inputs.compose-file != '' }}
        env:
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: docker compose -f "$COMPOSE_FILE" up -d --wait

      - name: Integration tests
        id: integration
        if: ${{ !cancelled() && steps.install.outcome != 'failure' && steps.services.outcome != 'failure' && needs.plan.outputs.integration != '' }}
        env:
          CMD: ${{ needs.plan.outputs.integration }}
        run: eval "$CMD"

      - name: Stop integration services
        if: always() && steps.services.outcome != 'skipped'
        env:
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          docker compose -f "$COMPOSE_FILE" logs --no-color > integration-services.log 2>&1 || true
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Coverage
        id: coverage
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        env:
          COVERAGE_FILE: ${{ needs.plan.outputs.coverage-file }}
          THRESHOLD: ${{ inputs.coverage-threshold }}
        shell: python3 {0}
        run: |
          import json, os, re, sys
          import xml.etree.ElementTree as ET

          path, threshold = os.environ["COVERAGE_FILE"], float(os.environ["THRESHOLD"])
          summary, output = os.environ["GITHUB_STEP_SUMMARY"], os.environ["GITHUB_OUTPUT"]

          def parse(p):
              text = open(p, encoding="utf-8").read()
              if text.startswith("mode:"):  # Go coverprofile
                  blocks = {}
                  for line in text.splitlines()[1:]:
                      m = re.match(r"(.+):(\d+\.\d+,\d+\.\d+) (\d+) (\d+)$", line)
                      if m:
                          prev = blocks.get((m[1], m[2]), (0, False))
                          blocks[(m[1], m[2])] = (int(m[3]), prev[1] or int(m[4]) > 0)
                  total = sum(s for s, _ in blocks.values())
                  return 100.0 * sum(s for s, h in blocks.values() if h) / total if total else 0.0
              if p.endswith(".json"):  # Istanbul json-summary
                  return float(json.loads(text)["total"]["lines"]["pct"])
              if text.lstrip().startswith("<"):  # Cobertura XML
                  return 100.0 * float(ET.fromstring(text).get("line-rate"))
              lf = sum(int(x) for x in re.findall(r"^LF:(\d+)", text, re.M))  # lcov
              lh = sum(int(x) for x in re.findall(r"^LH:(\d+)", text, re.M))
              return 100.0 * lh / lf if lf else 0.0

          if not os.path.isfile(path):
              msg = f"Coverage report '{path}' not found."
              with open(summary, "a") as f:
                  f.write(f"### Coverage\n{msg}\n")
              if threshold > 0:
                  print(f"::error::{msg} Cannot enforce the {threshold}% threshold.")
                  sys.exit(1)
              print(f"::notice::{msg} Skipping coverage report.")
              sys.exit(0)

          pct = round(parse(path), 2)
          ok = threshold <= 0 or pct >= threshold
          with open(output, "a") as f:
              f.write(f"percent={pct}\n")
          with open(summary, "a") as f:
              f.write("### Coverage\n| Lines | Threshold | Result |\n|---|---|---|\n")
              f.write(f"| {pct}% | {f'{threshold}%' if threshold > 0 else 'n/a'} | {'✅' if ok else '❌'} |\n")
          if not ok:
              print(f"::error::Line coverage {pct}% is below the required {threshold}%.")
              sys.exit(1)
          print(f"Line coverage: {pct}%")

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ needs.plan.outputs.suffix }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ inputs.working-directory }}/${{ needs.plan.outputs.coverage-file }}
            ${{ inputs.working-directory }}/coverage/
            ${{ inputs.working-directory }}/integration-services.log

      - name: Report
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          row() { case "$2" in success) i="✅";; failure) i="❌";; skipped|"") i="⏭️";; *) i="⚠️";; esac; echo "| $1 | $i ${2:-skipped} |"; }
          {
            echo "### Test"
            echo "| Check | Result |"
            echo "|---|---|"
            row "Unit tests" "$UNIT"
            row "Integration tests" "$INTEGRATION"
            row Coverage "$COVERAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-scan:
    name: Security / Dependencies
    needs: plan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        if: inputs.enable-dependency-review && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: ${{ inputs.dependency-review-fail-on-severity }}

      # ---- Runtime setup + dependency caching (keep in sync across jobs) ----
      - name: Setup pnpm
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - name: Enable corepack
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'yarn'
        run: corepack enable
      - name: Setup Node.js
        if: inputs.language == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.plan.outputs.version }}
          node-version-file: ${{ needs.plan.outputs.version-file }}
          cache: ${{ needs.plan.outputs.package-manager }}
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      - name: Re-enable corepack
        if: inputs.language == 'node' && needs.plan.outputs.package-manager == 'yarn'
        run: command -v corepack >/dev/null || npm install -g corepack; corepack enable
      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.plan.outputs.version }}
          python-version-file: ${{ needs.plan.outputs.version-file }}
          cache: pip
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.plan.outputs.version }}
          go-version-file: ${{ needs.plan.outputs.version-file }}
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}
      # ----------------------------------------------------------------------

      # pip-audit and govulncheck inspect the installed dependency set; JS audits read the lockfile.
      - name: Install dependencies
        if: needs.plan.outputs.audit != '' && inputs.language != 'node' && needs.plan.outputs.install != ''
        env:
          CMD: ${{ needs.plan.outputs.install }}
        run: eval "$CMD"

      - name: Dependency audit
        if: needs.plan.outputs.audit != ''
        env:
          CMD: ${{ needs.plan.outputs.audit }}
        run: eval "$CMD"

  secret-scan:
    name: Security / Secrets
    if: inputs.enable-secret-scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          extra_args: --results=verified,unknown

  code-scan:
    name: Security / Code (CodeQL)
    needs: plan
    if: inputs.enable-codeql
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.plan.outputs.version }}
          go-version-file: ${{ needs.plan.outputs.version-file }}
          cache-dependency-path: ${{ needs.plan.outputs.cache-path }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ needs.plan.outputs.codeql-language }}
          build-mode: ${{ needs.plan.outputs.codeql-build-mode }}
          source-root: ${{ inputs.working-directory }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ needs.plan.outputs.codeql-language }}/${{ needs.plan.outputs.suffix }}

  container:
    name: Container
    needs: [plan, validate, test, dependency-scan, secret-scan, code-scan]
    # Run only when every gate passed (disabled gates are "skipped" and allowed).
    if: ${{ inputs.enable-docker && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      image-name: ${{ needs.plan.outputs.image-name }}
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    env:
      IMAGE: ${{ needs.plan.outputs.image-name }}
      SCAN_REF: ci-scan:${{ github.sha }}
      PUSH: ${{ inputs.push-image && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.plan.outputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.SCAN_REF }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ needs.plan.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ needs.plan.outputs.suffix }}

      - name: Image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_REF }}
          format: sarif
          output: trivy-image.sarif
          severity: ${{ inputs.image-scan-severity }}
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload image scan to code scanning
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        continue-on-error: true # code scanning may be unavailable on private repos without GitHub Code Security
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-image.sarif
          category: container-image/${{ needs.plan.outputs.suffix }}

      - name: Image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: ${{ env.SCAN_REF }}
          format: table
          severity: ${{ inputs.image-scan-severity }}
          ignore-unfixed: true
          skip-setup-trivy: true
          exit-code: ${{ inputs.fail-on-image-vulnerabilities && '1' || '0' }}

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.SCAN_REF }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ needs.plan.outputs.suffix }}.spdx.json

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ needs.plan.outputs.suffix }}

      - name: Attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.plan.outputs.image-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Container"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Published | $PUSH |"
            echo "| Digest | \`${DIGEST:-n/a}\` |"
            # shellcheck disable=SC2016 # literal backticks for markdown
            echo "| Tags | $(echo "$TAGS" | sed '/^$/d; s/.*/`&`/' | paste -sd ' ' -) |"
            if [ -n "$DIGEST" ]; then
              echo ""
              echo "Verify provenance: \`gh attestation verify oci://$IMAGE@$DIGEST -R $GITHUB_REPOSITORY\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: CI result
    needs: [plan, validate, test, dependency-scan, secret-scan, code-scan, container]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Summarize
        env:
          NEEDS: ${{ toJSON(needs) }}
          COVERAGE: ${{ needs.test.outputs.coverage }}
        run: |
          {
            echo "## CI summary"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \({success:"✅ success",failure:"❌ failure",cancelled:"🚫 cancelled",skipped:"⏭️ skipped"}[.value.result] // .value.result) |"'
            if [ -n "$COVERAGE" ]; then
              echo ""
              echo "**Line coverage:** ${COVERAGE}%"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::CI failed: $failed"
            exit 1
          fi
